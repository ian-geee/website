<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julian G. · Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <div id="background"></div>
    <div id="navbar"></div>

    <div class="container" style="max-width:600px;">
        <h1 class="text-center">Contact</h1>
        <p style="text-align:center; color:rgb(255,196,0);">Une question, un projet ? Écrivez-moi.<br><span style="font-size:0.9rem; color:#9aa0a6;">A question or a project? Feel free to reach out.</span></p>

        <form action="https://formspree.io/f/xgorrpbn" method="POST" style="margin-top:1.5rem;">

            <div class="mb-3">
                <label for="name" style="color:white;">Nom</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Votre nom" required
                    style="background:rgba(255,255,255,0.05); color:white; border-color:rgba(255,196,0,0.4);">
            </div>

            <div class="mb-3">
                <label for="email" style="color:white;">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="votre@email.com" required
                    style="background:rgba(255,255,255,0.05); color:white; border-color:rgba(255,196,0,0.4);">
            </div>

            <div class="mb-3">
                <label for="subject" style="color:white;">Sujet</label>
                <select id="subject" name="subject" class="form-select"
                    style="background:rgba(0,0,0,0.8); color:white; border-color:rgba(255,196,0,0.4);">
                    <option value="">-- Choisissez / Select --</option>
                    <option value="cours">Cours particuliers</option>
                    <option value="accompagnement">Orientation et mentorat</option>
                    <option value="projet">Projet tech / data sur mesure</option>
                    <option value="recrutement">Recruitment / professional collaboration</option>
                    <option value="autre">Autre / Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="message" style="color:white;">Message</label>
                <textarea id="message" name="message" class="form-control" rows="5" placeholder="Décrivez votre besoin..." required
                    style="background:rgba(255,255,255,0.05); color:white; border-color:rgba(255,196,0,0.4);"></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-lg">Envoyer</button>
            </div>
        </form>

        <p style="margin-top:1.5rem; text-align:center; color:#9aa0a6; font-size:0.85rem;">
            Ou directement sur <a href="https://www.linkedin.com/in/ian-gee/" target="_blank" style="color:rgb(255,196,0);">LinkedIn</a>.
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/includes-manager-no-header.js"></script>
    <script src="src/js/background-switcher.js"></script>
</body>
</html>
