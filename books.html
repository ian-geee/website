<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books — Julian</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="src/css/styles.css">
  <style>
    .table thead th { position: sticky; top: 0; background: #111; z-index: 1; }
    .search-input { max-width: 520px; }
    .chip { display:inline-block; padding:.15rem .5rem; border:1px solid #444; border-radius:999px; font-size:.8rem; margin-right:.25rem; }
  </style>
</head>
<body>
  <div id="background"></div>
  <!-- Navigation -->
  <div id="navbar"></div>
  <!-- Header Section -->
  <div id="header"></div>

  <section class="py-5">
    <div class="container">
      <h1 class="mb-3" style="color: rgb(255, 196, 0)">Books I Study</h1>
      <p class="mb-4">Curated references I'm actively using to build solid foundations in data science, ML and math. Use the search to filter quickly.</p>

      <div class="input-group mb-3 search-input">
        <span class="input-group-text">Search</span>
        <input id="search" type="text" class="form-control" placeholder="Title, author, domain, chapter...">
      </div>

      <div class="table-responsive">
        <table class="table table-dark table-striped table-bordered align-middle" id="booksTable" style="font-size:0.7em">
          <thead>
            <tr>
              <th style="min-width:240px">Title</th>
              <th>Authors</th>
              <th>Domain</th>
              <th style="min-width:340px;">Chapters & Notes (short)</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script>
    // Data source — easy to edit
    const BOOKS = [
      {
        title: "Statistical Foundations of Machine Learning: The Handbook (2022)",
        authors: "G. Bontempi (ULB)",
        domain: "Machine Learning",
        chapters: "Probability recap; estimation; bias-variance; regularization; model selection; resampling."
      },
      {
        title: "Hands-on Machine Learning with Scikit-Learn, Keras & TensorFlow (3e, 2022)",
        authors: "A. Géron (O'Reilly)",
        domain: "Deep Learning",
        chapters: "End-to-end ML; pipelines; feature engineering; TF; CNNs; RNNs."
      },
      {
        title: "Deep Learning (2016)",
        authors: "I. Goodfellow et al. MIT Press)",
        domain: "Deep Learning",
        chapters: "Linear algebra; optimization; CNN/RNN basics; regularization; representation learning."
      },
      {
        title: "An Introduction to Statistical Learning with Applications in Python (2e, 2023)",
        authors: "G. James et al. (Springer)",
        domain: "Machine Learning",
        chapters: "Resampling; linear models; tree-based; SVM; PCA; model selection."
      },
      {
        title: "Probabilistic Machine Learning: An Introduction (2022)",
        authors: "K. P. Murphy (MIT Press)",
        domain: "Machine Learning",
        chapters: "Graphical models; inference; predictive uncertainty; Bayesian methods."
      },
      {
        title: "Understanding Deep Learning (2023)",
        authors: "S. J. D. Prince (MIT Press)",
        domain: "Deep learning",
        chapters: "Optimization; generalization; convnets; attention; generative models."
      },
      {
        title: "CS229: Machine Learning (Stanford, Andrew Ng, 2018)",
        authors: "Andrew Ng",
        domain: "Machine Learning",
        chapters: "Linear regression; logistic regression; generative models; SVM; neural nets; learning theory; unsupervised learning."
      },
      {
        title: "Analysis of Generalized Linear Mixed Models in Agricultural and Natural Resources Sciences (2012)",
        authors: "E. Gbur et al.",
        domain: "Generalized Linear Mixed Models",
        chapters: "Introduction GLMM; estimation; diagnostics; exemples concrets; interprétation."
      },
      {
        title: "Probability and Statistics for Engineering and the Sciences (9e éd., 2015)",
        authors: "Jay L. Devore",
        domain: "Multivariate Statistics",
        chapters: "Probabilités; distributions; estimation; tests; ANOVA; régression."
      },
      {
        title: "Pattern Recognition and Machine Learning (2006)",
        authors: "Christopher M. Bishop",
        domain: "Machine Learning",
        chapters: "Probabilistic models; linear models; kernel methods; graphical models; approximate inference."
      }

    ];

    // Build table
    const tbody = document.querySelector("#booksTable tbody");
    const rows = BOOKS.map(b => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${b.title}</strong></td>
        <td>${b.authors}</td>
        <td>${b.domain}</td>
        <td>${b.chapters}</td>
      `;
      return tr;
    });
    rows.forEach(r => tbody.appendChild(r));

    // Search filter
    const search = document.getElementById("search");
    search.addEventListener("input", () => {
      const q = search.value.toLowerCase();
      [...tbody.rows].forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(q) ? "" : "none";
      });
    });

    document.querySelectorAll("#booksTable thead th").forEach((th, idx) => {
      th.classList.add("sortable"); // marquer toutes les colonnes comme triables
      th.addEventListener("click", () => {
        const rowsArr = [...tbody.rows];
        const asc = th.dataset.sort !== "asc";

        // reset classes sur tous les th
        document.querySelectorAll("#booksTable thead th")
          .forEach(col => col.classList.remove("sort-asc", "sort-desc"));

        rowsArr.sort((a,b) => {
          const ta = a.cells[idx].innerText.toLowerCase();
          const tb = b.cells[idx].innerText.toLowerCase();
          return asc ? ta.localeCompare(tb) : tb.localeCompare(ta);
        });

        th.dataset.sort = asc ? "asc" : "desc";
        th.classList.add(asc ? "sort-asc" : "sort-desc");
        rowsArr.forEach(r => tbody.appendChild(r));
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="src/js/includes-manager.js"></script>
  <script src="src/js/background-switcher.js"></script> <!-- A exécuter après l'insertion des backgrounds :dumb_face: -->
</body>
</html>
