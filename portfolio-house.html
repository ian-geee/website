<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julian's Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="src/css/cardgrid.css">
    <style>
        :root{
        --bg:#0b0b0e; --card:rgba(0, 0, 0, 0.9);; --muted:#9aa1a9; --text:#e9eef2;
        --ok:#22c55e; --err:#ef4444; --border:#212433; --color_gold: rgb(255, 196, 0);
        }

        *{ box-sizing:border-box; }

        /* Wrapper central (ex- .wrap) */
        .wrap{ max-width:860px; margin:40px auto; padding:0 16px; }

        /* Grids */
        .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
        form .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }

        /* Cards */
        .card{
        background:var(--card);
        border:1px solid var(--border);
        border-radius:16px;
        padding:16px;
        display:flex;
        flex-direction:column;
        gap:12px;
        position:relative;
        overflow:hidden;
        box-shadow:0 10px 30px rgba(0,0,0,.25);
        }
        .card h3{ margin:0; font-size:18px; }
        .card p{ margin:0; color:var(--muted); }

        /* Tags & actions (si utilisés) */
        .tags{ display:flex; flex-wrap:wrap; gap:6px; }
        .tag{
        font-size:12px; padding:4px 8px; border:1px solid var(--border);
        border-radius:999px; color:#cfe1ff; background:#1b2436;
        }
        .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }
        .link{
        display:inline-flex; align-items:center; gap:6px; padding:8px 12px;
        border-radius:10px; border:1px solid var(--border); text-decoration:none; color:var(--text);
        }
        .link.primary{ background:var(--color_gold); color:#0b0b0e; border-color:transparent; font-weight:700; }
        .meta{ font-size:12px; color:var(--muted); }
        .pill{
        position:absolute; top:12px; right:12px; background:#1b2436; border:1px solid var(--border);
        color:#cfe1ff; padding:4px 8px; border-radius:999px; font-size:12px;
        }

        /* Formulaires */
        label{ display:block; font-size:14px; margin:6px 0; color:var(--muted); }
        input, select, textarea{
        width:100%; padding:10px 12px; border:1px solid var(--border);
        background:#0f1116; color:var(--text); border-radius:10px;
        }
        button{
        margin-top:14px; padding:12px 16px; border:0; border-radius:12px;
        background:var(--color_gold); color:#0b0b0e; font-weight:700; cursor:pointer;
        }
        button[disabled]{ opacity:.6; cursor:not-allowed; }

        /* Controls (filtres, boutons pills) */
        .controls{ display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; }
        .btn{
        appearance:none; border:1px solid var(--border); background:#11131a; color:var(--text);
        padding:8px 12px; border-radius:999px; cursor:pointer; font-weight:600;
        }
        .btn[aria-pressed="true"]{ background:var(--color_gold); color:#0b0b0e; border-color:transparent; }
        .search{ flex:1; display:flex; gap:8px; align-items:center; }
        .search input{ border:1px solid var(--border); background:#0f1116; color:var(--text); border-radius:10px; }

        /* Text utils */
        .muted{ color:var(--muted); }
        .status{ margin-left:10px; color:var(--muted); }
        .result{ margin-top:16px; }
        .price{ font-size:28px; font-weight:800; }
        .footer{ margin-top:14px; font-size:12px; color:var(--muted); }

        /* Helpers */
        .hidden{ display:none !important; }
  </style>
</head>
<body>
    <div id="background"></div>
    <!-- Navigation -->
    
    <!-- Header Section -->
    <div id="header"></div>
    <div id="navbar"></div>

    <div class="wrap">
        <div class="card">
        <h1>House Price Estimator 🏡</h1>
        <p class="subtitle muted">Enter a few features and submit to get an estimated price (Belgium, EUR).</p>

        <form id="f" novalidate>
            <div class="grid">
            <div>
                <label for="habitable_surface">Habitable area (m²)</label>
                <input id="habitable_surface" type="number" step="1" min="30" max="600" required placeholder="120">
            </div>
            <div>
                <label for="bedrooms_count">Bedrooms</label>
                <input id="bedrooms_count" type="number" step="1" min="1" max="8" required placeholder="3">
            </div>
            <div>
                <label for="post_code">Postal code (4 digits)</label>
                <input id="post_code" type="text" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required placeholder="1070" title="4 digits (e.g., 1070)">
            </div>
            <div>
                <label for="num_facade">Facades (1–4)</label>
                <input id="num_facade" type="number" step="1" min="1" max="4" required placeholder="2">
            </div>
            </div>

            <div style="display:flex;align-items:center;gap:8px">
            <button id="btn" type="submit">PREDICT</button>
            <span id="status" class="status"></span>
            </div>
        </form>

        <div id="result" class="result" style="display:none">
            <div class="price" id="price">—</div>
            <div class="muted">Educational estimate (EUR).</div>
        </div>

        <div class="footer">
            API: FastAPI · Model: scikit-learn (HistGBR, log1p) · Features: habitable_surface, bedrooms_count, post_code, num_facade
        </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/includes-manager-portfolio.js"></script>
    <script src="src/js/background-switcher.js"></script> <!-- A exécuter après l'insertion des backgrounds :dumb_face: -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="src/js/short-radar.js"></script>
    <script src="src/js/house-api.js"></script>

</body>
</html>
