<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iris Classifier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="src/css/styles.css">
  <style>
    :root { --bg:#0b0b0e; --card:#141419; --muted:#9aa1a9; --text:#e9eef2; --accent:#6ea8fe; --ok:#22c55e; --err:#ef4444; }
    *{box-sizing:border-box} 
    /* body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Roboto,Ubuntu,sans-serif} */
    .wrap{max-width:860px;margin:40px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid #1f2430;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    /* h1{font-size:28px;margin:0 0 10px} p.subtitle{margin:0 0 18px;color:var(--muted)} */
    form .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    label{display:block;font-size:14px;margin:6px 0 6px;color:var(--muted)}
    input{width:100%;padding:10px 12px;border:1px solid #2a3242;background:#0f1116;color:var(--text);border-radius:10px}
    button{margin-top:14px;padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:#0b0b0e;font-weight:600;cursor:pointer}
    button[disabled]{opacity:.6;cursor:not-allowed}
    .status{margin-left:10px;color:var(--muted)}
    .result{margin-top:16px}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#1b2436;color:#cfe1ff;border:1px solid #2c3a55;font-weight:600}
    .probs{margin-top:10px;display:grid;gap:8px}
    .bar{background:#0f1116;border:1px solid #2a3242;border-radius:10px;padding:8px}
    .bar-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
    .bar-track{height:10px;background:#0b0e14;border-radius:999px;overflow:hidden;border:1px solid #222a38}
    .bar-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
    .muted{color:var(--muted)}
    .footer{margin-top:14px;font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
    <div id="background"></div>
    <!-- Navigation -->
    <div id="navbar"></div>
    <!-- Header Section -->
    <div id="header"></div>
  <div class="wrap">
    <div class="card">
      <h1>Iris Classifier 🌸</h1>
      <p class="subtitle muted">Please enter 4 dimensions and submit to receive a prediction from my API.</p>

      <form id="f">
        <div class="grid">
          <div><label for="sepal_length">Sepal length (cm)</label><input id="sepal_length" type="number" step="0.1" min="0" required></div>
          <div><label for="sepal_width">Sepal width (cm)</label><input id="sepal_width" type="number" step="0.1" min="0" required></div>
          <div><label for="petal_length">Petal length (cm)</label><input id="petal_length" type="number" step="0.1" min="0" required></div>
          <div><label for="petal_width">Petal width (cm)</label><input id="petal_width" type="number" step="0.1" min="0" required></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button id="btn" type="submit">PREDICT</button>
          <span id="status" class="status"></span>
        </div>
      </form>

      <div id="result" class="result" style="display:none">
        <div id="predBadge" class="badge">—</div>
        <div class="probs" id="probs"></div>
      </div>
      <div class="footer">
        API: FastAPI · Model: scikit-learn (LogReg) · Features: sepal_length, sepal_width, petal_length, petal_width
      </div>
    </div>
  </div>

<script>
  // 🔧 Remplace par TON URL Render (HTTPS !)
  const API_URL = "https://ml-api-nebk.onrender.com/api/v1/iris/predict";

  const form = document.getElementById("f");
  const btn = document.getElementById("btn");
  const statusEl = document.getElementById("status");
  const result = document.getElementById("result");
  const predBadge = document.getElementById("predBadge");
  const probsBox = document.getElementById("probs");

  function toPayload(){
    return {
      sepal_length: parseFloat(document.getElementById("sepal_length").value),
      sepal_width:  parseFloat(document.getElementById("sepal_width").value),
      petal_length: parseFloat(document.getElementById("petal_length").value),
      petal_width:  parseFloat(document.getElementById("petal_width").value),
    };
  }

  function renderProbs(probObj){
    probsBox.innerHTML = "";
    const entries = Object.entries(probObj).sort((a,b)=>b[1]-a[1]); // tri desc
    entries.forEach(([label, p])=>{
      const pct = Math.round(p*100);
      const row = document.createElement("div");
      row.className = "bar";
      row.innerHTML = `
        <div class="bar-row"><span>${label}</span><span>${pct}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      `;
      probsBox.appendChild(row);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    statusEl.textContent = "Predicting...";
    result.style.display = "none";

    try {
      const payload = toPayload();
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });

      if(!res.ok){
        const err = await res.json().catch(()=>({detail:`HTTP ${res.status}`}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }

      const data = await res.json();
      statusEl.textContent = "Ok";
      predBadge.textContent = data.predicted_class_label ?? `Class ${data.predicted_class_index}`;
      renderProbs(data.probabilities || {});
      result.style.display = "block";
    } catch (err){
      statusEl.textContent = "Error: " + err.message;
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="src/js/includes-manager.js"></script>
<script src="src/js/background-switcher.js"></script> <!-- A exécuter après l'insertion des backgrounds :dumb_face: -->
</body>
</html>
