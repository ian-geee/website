<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julian's Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="src/css/cardgrid.css">
    <style>
        :root{
        --bg:#0b0b0e; --card:rgba(0, 0, 0, 0.9);; --muted:#9aa1a9; --text:#e9eef2;
        --ok:#22c55e; --err:#ef4444; --border:#212433; --color_gold: rgb(255, 196, 0);
        }

        *{ box-sizing:border-box; }

        /* Wrapper central (ex- .wrap) */
        .wrap{ max-width:860px; margin:40px auto; padding:0 16px; }

        /* Grids */
        .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
        form .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }

        /* Cards */
        .card{
        background:var(--card);
        border:1px solid var(--border);
        border-radius:16px;
        padding:16px;
        display:flex;
        flex-direction:column;
        gap:12px;
        position:relative;
        overflow:hidden;
        box-shadow:0 10px 30px rgba(0,0,0,.25);
        }
        .card h3{ margin:0; font-size:18px; }
        .card p{ margin:0; color:var(--muted); }

        /* Tags & actions (si utilisés) */
        .tags{ display:flex; flex-wrap:wrap; gap:6px; }
        .tag{
        font-size:12px; padding:4px 8px; border:1px solid var(--border);
        border-radius:999px; color:#cfe1ff; background:#1b2436;
        }
        .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }
        .link{
        display:inline-flex; align-items:center; gap:6px; padding:8px 12px;
        border-radius:10px; border:1px solid var(--border); text-decoration:none; color:var(--text);
        }
        .link.primary{ background:var(--color_gold); color:#0b0b0e; border-color:transparent; font-weight:700; }
        .meta{ font-size:12px; color:var(--muted); }
        .pill{
        position:absolute; top:12px; right:12px; background:#1b2436; border:1px solid var(--border);
        color:#cfe1ff; padding:4px 8px; border-radius:999px; font-size:12px;
        }

        /* Formulaires */
        label{ display:block; font-size:14px; margin:6px 0; color:var(--muted); }
        input, select, textarea{
        width:100%; padding:10px 12px; border:1px solid var(--border);
        background:#0f1116; color:var(--text); border-radius:10px;
        }
        button{
        margin-top:14px; padding:12px 16px; border:0; border-radius:12px;
        background:var(--color_gold); color:#0b0b0e; font-weight:700; cursor:pointer;
        }
        button[disabled]{ opacity:.6; cursor:not-allowed; }

        /* Controls (filtres, boutons pills) */
        .controls{ display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; }
        .btn{
        appearance:none; border:1px solid var(--border); background:#11131a; color:var(--text);
        padding:8px 12px; border-radius:999px; cursor:pointer; font-weight:600;
        }
        .btn[aria-pressed="true"]{ background:var(--color_gold); color:#0b0b0e; border-color:transparent; }
        .search{ flex:1; display:flex; gap:8px; align-items:center; }
        .search input{ border:1px solid var(--border); background:#0f1116; color:var(--text); border-radius:10px; }

        /* Text utils */
        .muted{ color:var(--muted); }
        .status{ margin-left:10px; color:var(--muted); }
        .result{ margin-top:16px; }
        .price{ font-size:28px; font-weight:800; }
        .footer{ margin-top:14px; font-size:12px; color:var(--muted); }

        /* Helpers */
        .hidden{ display:none !important; }
        .bar{background:#0f1116;border:1px solid #2a3242;border-radius:10px;padding:8px}
        .bar-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
        .bar-track{height:10px;background:#0b0e14;border-radius:999px;overflow:hidden;border:1px solid #222a38}
        .bar-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
    </style>
</head>
<body>
    <div id="background"></div>
    <!-- Navigation -->
    
    <!-- Header Section -->
    <div id="header"></div>
    <div id="navbar"></div>

    <div class="wrap">
    <div class="card">
      <h1>Iris Classifier 🌸</h1>
      <p class="subtitle muted">Please enter 4 dimensions and submit to receive a prediction from my API.</p>

      <form id="f">
        <div class="grid">
          <div><label for="sepal_length">Sepal length (cm)</label><input id="sepal_length" type="number" step="0.1" min="0" required placeholder="5.5"></div>
          <div><label for="sepal_width">Sepal width (cm)</label><input id="sepal_width" type="number" step="0.1" min="0" required placeholder="3"></div>
          <div><label for="petal_length">Petal length (cm)</label><input id="petal_length" type="number" step="0.1" min="0" required placeholder="4"></div>
          <div><label for="petal_width">Petal width (cm)</label><input id="petal_width" type="number" step="0.1" min="0" required placeholder="1.5"></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button id="btn" type="submit">PREDICT</button>
          <span id="status" class="status"></span>
        </div>
      </form>

      <div id="result" class="result" style="display:none">
        <div id="predBadge" class="badge">—</div>
        <div class="probs" id="probs"></div>
      </div>
      <div class="footer">
        API: FastAPI · Model: scikit-learn (LogReg) · Features: sepal_length, sepal_width, petal_length, petal_width
      </div>
    </div>
  </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/includes-manager-portfolio.js"></script>
    <script src="src/js/background-switcher.js"></script> <!-- A exécuter après l'insertion des backgrounds :dumb_face: -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="src/js/short-radar.js"></script>
    <script src="src/js/iris-api.js"></script>

</body>
</html>
