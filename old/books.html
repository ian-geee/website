<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="src/css/styles.css">
  <style>
    .table thead th { position: sticky; top: 0; background: #111; z-index: 1; }
    .search-input { max-width: 520px; }
    .chip { display:inline-block; padding:.15rem .5rem; border:1px solid #444; border-radius:999px; font-size:.8rem; margin-right:.25rem; }
  </style>
</head>
<body>
  <div id="background"></div>
  <!-- Navigation -->
  <div id="navbar"></div>
  <!-- Header Section -->
  <div id="header"></div>

  <div style="max-width: 1600px; margin-inline:auto; display:grid; grid-template-columns:repeat(2, minmax(0,1fr));gap: 20px; margin-bottom: 20px;font-size:0.7em">
    <section id="projects" class="container">
      <h1 class="text-center mb-3" style="color:white">Projects</h1>

      <div class="mb-3">
        <input id="projSearch" class="form-control" placeholder="Search projects..." />
      </div>

      <div class="table-responsive">
        <table id="projectsTable" class="table table-dark table-hover align-middle">
          <thead>
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Priority</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="container">
      <h1 class="text-center mb-3">Books I Study</h1>
      <p class="mb-4">Curated references I'm actively using…</p>

      <div class="input-group mb-3 search-input">
        <span class="input-group-text">Search</span>
        <input id="bookSearch" type="text" class="form-control" placeholder="Title, author, domain, chapter...">
      </div>

      <div class="table-responsive">
        <table id="booksTable" class="table table-dark table-striped table-bordered align-middle">
          <thead>
            <tr>
              <th style="min-width:240px">Title</th>
              <th>Authors</th>
              <th>Domain</th>
              <th style="min-width:340px;">Chapters & Notes (short)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="src/js/planning.js"></script>
  <script src="src/js/books.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="src/js/includes-manager.js"></script>
  <script src="src/js/background-switcher.js"></script> <!-- A exécuter après l'insertion des backgrounds :dumb_face: -->
</body>
</html>
